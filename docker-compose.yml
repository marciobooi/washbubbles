# Every service shares the same log-rotation limits: the default json-file
# driver keeps logs forever, and on a long-running server that quietly fills
# the disk. 10 MB x 3 files per container is enough to debug a recent issue
# without becoming a disk-space incident.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    logging: *default-logging
    # MONGO_AUTH=--auth in .env.docker makes the database ask for a user and password (create the users first, see
    # docs/SUPORTE-LOJAS.md); unset, it runs open as before, which is only acceptable because the port is not published.
    command: ["mongod", "--bind_ip_all", "${MONGO_AUTH:---noauth}"]
    volumes:
      - washbubbles_mongo_data:/data/db
    ports:
      - "127.0.0.1:27018:27017" # this machine only (the host nginx and ssh tunnels); never the internet

  # Free, self-hosted machine translation for the public page's admin-written text
  # (services/translator.js). Internal only: no published port, the backend reaches it by name.
  # The first start downloads the language models (a few hundred MB) into the volume; the
  # languages are limited to the ones the page is served in, to keep memory use down.
  libretranslate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      LT_LOAD_ONLY: pt,en,fr,de,es
      LT_DISABLE_WEB_UI: "true"
      LT_UPDATE_MODELS: "false"
      # Each worker holds every language model in memory (about 900 MB each): with the default threads it was killed 25 times by the
      # 3 GB limit (to 2026-10-19). Fewer threads and a roomier limit (the server has 7.6 GB and the rest uses under 1 GB); 4 GB was still hit twice in the first days (2026-11-10), now 5 GB.
      LT_THREADS: "2"
    volumes:
      - washbubbles_lt_models:/home/libretranslate/.local
    mem_limit: 5g

  backend:
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    volumes:
      # Uploaded logo/banner images (routes/admin.js) — without this they
      # live only in the container's own writable layer and are gone on the
      # next `docker compose up --build`, same as every unlisted file there.
      - washbubbles_uploads:/public/uploads
      # The program as a zip + its version, written by scripts/hetzner-autodeploy.sh: shop PCs install and update from it (routes/installer.js).
      - ./release:/release:ro
      # The daily copies: each shop's own and this server's copy of that shop (services/dailyBackup.js).
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    environment:
      MONGODB_URL: ${MONGODB_URL:-mongodb://mongo:27017/washstore}
      BACKUP_DIR: /backups
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.docker}
      PORT: 3000
      # Only read by the first-time seed (backend/scripts/seed.cjs). No built-in default: a server is never born with a known password.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env.docker}
      KIOSK_PASSWORD: ${KIOSK_PASSWORD:?set KIOSK_PASSWORD in .env.docker}
      KIOSK_API_KEY: ${KIOSK_API_KEY:?set KIOSK_API_KEY in .env.docker}
      # Outbound email (password reset, day-close reports, receipts, alerts —
      # see docs/SHOP-HARDWARE-AND-COMMUNICATIONS.md §15). Optional: unset
      # MAIL_HOST in .env.docker and mailer.js logs instead of sending, same
      # safe fallback as local dev. Default port is 587, NOT amen.pt's own
      # documented 465 — Hetzner silently blocks 25 and 465 outbound; 587
      # (STARTTLS) is the one that actually connects from this host.
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # This process sits behind two nginx hops (host nginx, then the
      # frontend container's own nginx) — see index.js's own comment on this.
      TRUST_PROXY: 2
      # The first shop owns this address (and www) until addresses are set per shop in the admin (Lojas).
      PRIMARY_DOMAIN: freshbubbles.pt
      # The site and the admin are same-origin: only our own addresses may call the API from a browser.
      CORS_ORIGINS: https://freshbubbles.pt,https://www.freshbubbles.pt
      # This is the central/reporting server, not a shop kiosk PC: it has no
      # local coin/bill hardware to drive, so don't try (and don't log
      # "cannot open 40" for a peripheral address that means something only
      # to a controller this server was never wired to).
      ENABLE_COIN_MACHINE: "false"
      # Server-rendered public front page at "/" (see src/views/landing.js) —
      # real HTML for crawlers/link-previews, not the client-rendered SPA.
      # nginx.conf routes the exact "/" path here; everything else still goes
      # to the SPA. Only meaningful on this cloud deployment — never set on a
      # shop-kiosk install, whose "/" is the real point-of-sale UI.
      PUBLIC_LANDING_PAGE: "true"
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://freshbubbles.pt}
      # Translation of the public page's text (see services/translator.js). Unset = no translation.
      TRANSLATE_URL: http://libretranslate:5000
    depends_on:
      - mongo
    # No published port: two backends run side by side during a deploy (scripts/hetzner-autodeploy.sh) and only the frontend
    # containers reach them, by name. For a look from the server itself: docker compose exec backend ...

  frontend:
    image: washbubbles-frontend
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        # No real KIOSK_API_KEY here on purpose: this build serves the public
        # site, which no longer ships the kiosk sale UI (see VITE_PUBLIC_SITE
        # below) — baking the real key into a publicly-servable JS bundle
        # would leak it to anyone who opens devtools.
        VITE_PUBLIC_SITE: "true"
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8081:80" # the host nginx (TLS) is the only door

  # The same site a second time, so that one is always up while the other is replaced (the host nginx sends to both, see
  # docker/host-nginx-upstream.conf). Same image as frontend: built once, never pulled.
  frontend_b:
    image: washbubbles-frontend
    pull_policy: never
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8082:80"

volumes:
  washbubbles_lt_models:
  washbubbles_mongo_data:
  washbubbles_uploads:
