# Every service shares the same log-rotation limits: the default json-file
# driver keeps logs forever, and on a long-running server that quietly fills
# the disk. 10 MB x 3 files per container is enough to debug a recent issue
# without becoming a disk-space incident.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - washbubbles_mongo_data:/data/db
    ports:
      - "27018:27017"

  backend:
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    environment:
      MONGODB_URL: mongodb://mongo:27017/washstore
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.docker}
      PORT: 3000
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      KIOSK_PASSWORD: ${KIOSK_PASSWORD:-kiosk1234}
      KIOSK_API_KEY: ${KIOSK_API_KEY:?set KIOSK_API_KEY in .env.docker}
      # Outbound email (password reset, day-close reports, receipts, alerts —
      # see docs/SHOP-HARDWARE-AND-COMMUNICATIONS.md §15). Optional: unset
      # MAIL_HOST in .env.docker and mailer.js logs instead of sending, same
      # safe fallback as local dev. Default port is 587, NOT amen.pt's own
      # documented 465 — Hetzner silently blocks 25 and 465 outbound; 587
      # (STARTTLS) is the one that actually connects from this host.
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # This process sits behind two nginx hops (host nginx, then the
      # frontend container's own nginx) — see index.js's own comment on this.
      TRUST_PROXY: 2
      # This is the central/reporting server, not a shop kiosk PC: it has no
      # local coin/bill hardware to drive, so don't try (and don't log
      # "cannot open 40" for a peripheral address that means something only
      # to a controller this server was never wired to).
      ENABLE_COIN_MACHINE: "false"
      # Server-rendered public front page at "/" (see src/views/landing.js) —
      # real HTML for crawlers/link-previews, not the client-rendered SPA.
      # nginx.conf routes the exact "/" path here; everything else still goes
      # to the SPA. Only meaningful on this cloud deployment — never set on a
      # shop-kiosk install, whose "/" is the real point-of-sale UI.
      PUBLIC_LANDING_PAGE: "true"
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://freshbubbles.pt}
    depends_on:
      - mongo
    ports:
      - "3010:3000"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        # No real KIOSK_API_KEY here on purpose: this build serves the public
        # site, which no longer ships the kiosk sale UI (see VITE_PUBLIC_SITE
        # below) — baking the real key into a publicly-servable JS bundle
        # would leak it to anyone who opens devtools.
        VITE_PUBLIC_SITE: "true"
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  washbubbles_mongo_data:
