server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # One address per page, for every shop: www.<domain> goes to <domain> (search engines treat them as two sites otherwise).
    if ($host ~ ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    include /etc/nginx/snippets/security-headers.conf;

    # nginx's own default (1m) is well under the admin upload endpoints'
    # 5MB multer limit (routes/admin.js) — a real phone photo hits this
    # before the app ever sees it. The host-level nginx in front of this
    # container (Hetzner, TLS-terminating) needs the same override; it isn't
    # part of this repo, so it's set directly on the server.
    client_max_body_size 10m;

    # Server-rendered public front page (src/views/landing.js) — real HTML in
    # the first response for crawlers/link-previews, not the client-rendered
    # SPA. Exact matches only: everything else (including /admin/*) still
    # falls through to the SPA below. Backend must have PUBLIC_LANDING_PAGE=true
    # (docker-compose.yml) or these 404 — this nginx config is only ever used
    # by this cloud deployment's frontend container, never the shop-kiosk build.
    location = / {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # The same page in other languages (admin text translated when it is saved): /en /fr /de /es
    location ~ ^/(en|fr|de|es)/?$ {
        proxy_pass http://backend:3000/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Legal pages (privacy, terms, cookies) and the self-hosted fonts are served by the backend too.
    location ~ ^/((en|fr|de|es)/)?legal/(privacy|terms|cookies)/?$ {
        proxy_pass http://backend:3000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # MB WAY by QR: the customer's phone opens /pagar/<token> (single-use page served by the backend)
    location /pagar/ {
        proxy_pass http://backend:3000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location /og/ {
        proxy_pass http://backend:3000/og/;
        proxy_set_header Host $host;
    }
    location /fonts/ {
        proxy_pass http://backend:3000/fonts/;
        proxy_set_header Host $host;
    }
    location = /robots.txt {
        proxy_pass http://backend:3000/robots.txt;
        proxy_set_header Host $host;
    }
    location = /sitemap.xml {
        proxy_pass http://backend:3000/sitemap.xml;
        proxy_set_header Host $host;
    }

    # Same-origin reverse proxy for the API — mirrors the intended Hetzner
    # topology (nginx in front of the Node backend on one public origin) so
    # the frontend's same-origin fallback (see AuthContext.jsx,
    # useMachineStatus.js, services/websocket.js) is exercised for real.
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Uploaded logo/banner images — backend now serves these itself (see
    # index.js's own comment); this container has no shared filesystem with
    # it, so without this proxy these fell through to the SPA below and
    # never actually loaded.
    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_set_header Host $host;
    }

    location /ws {
        proxy_pass http://backend:3000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /hardware-agent {
        proxy_pass http://backend:3000/hardware-agent;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # SPA fallback for client-side routing
    # The admin web app (React SPA): only its own routes get the app shell, and never into a search index.
    location ~ ^/(admin|forgot-password|reset-password|pos)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-spa-report-only.conf;
        rewrite ^ /index.html break;
    }
    location = /index.html { return 404; }

    # Everything else is a file that exists (built assets, favicon...) or a REAL 404 page — not the app shell
    # with a 200, which search engines would index as a "soft 404" for every mistyped address.
    location / {
        try_files $uri @notfound;
    }
    location @notfound {
        # a named location cannot carry a URI in proxy_pass: rewrite to /404 and keep the status the backend sends
        rewrite ^ /404 break;
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }
}
