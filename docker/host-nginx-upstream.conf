# The host nginx on the Hetzner server (TLS, /etc/nginx/sites-enabled/freshbubbles.pt) is not deployed from this repo: this is the
# part of it that sends the site to the two frontend containers (docker-compose.yml: frontend on 8081, frontend_b on 8082).
# While one of them is being replaced the other answers; a request that could not reach one goes to the other.
#
# At the top of the site file (outside the server blocks):
upstream wb_front {
    server 127.0.0.1:8081 max_fails=1 fail_timeout=3s;
    server 127.0.0.1:8082 max_fails=1 fail_timeout=3s;
}

# And in "location /" of the TLS server block, instead of proxy_pass http://127.0.0.1:8081;
#     proxy_pass http://wb_front;
#     proxy_next_upstream error timeout http_502 http_503;
#     proxy_next_upstream_tries 2;
