# Security headers. nginx DROPS the server-level add_header lines inside any location that has an add_header of its own, so
# this file is included at server level AND in those locations (the admin pages and /pagar/ used to go out without HSTS or
# a referrer policy).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Nobody may put the admin or the kiosk pages inside another site's frame (click-jacking).
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Framing is refused everywhere.
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
