# The full content policy, in REPORT-ONLY mode, for the app pages only (admin and kiosk: React, no inline scripts). Violations show in
# the browser console without blocking anything; once the admin and the kiosk run without any it can be enforced here.
# Not applied to the server-rendered public pages (home, legal, /pagar/, 404): they carry small inline scripts of their own and
# would need per-script hashes first.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
