name: test and deploy
on:
  push:
    branches: [main]
concurrency: deploy
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: ssh to Hetzner (forced command runs scripts/deploy-hetzner.sh)
        env:
          KEY: ${{ secrets.HETZNER_DEPLOY_KEY }}
          HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes root@"$HOST" deploy
